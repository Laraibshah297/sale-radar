<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sale Radar</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16191d;--mute:#5f6670;--line:#e3e6ea;--brand:#0f766e;--sale:#c2410c;--good:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1a1d21;--ink:#eceef1;--mute:#9aa1aa;--line:#2b2f35;--brand:#2dd4bf;--sale:#fb923c;--good:#4ade80}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 8px;color:var(--brand)}
h1 small{color:var(--mute);font-weight:400;font-size:13px;margin-left:6px}
#q{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
select,label.chk{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
label.chk{display:flex;gap:6px;align-items:center;cursor:pointer}
main{padding:16px}
#meta{color:var(--mute);font-size:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--line)}
.body{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.store{font-size:12px;color:var(--brand);font-weight:600}
.title{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:700}
.was{color:var(--mute);text-decoration:line-through;font-weight:400;font-size:13px;margin-left:6px}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.b{font-size:11px;padding:2px 6px;border-radius:6px;font-weight:600}
.b.sale{background:var(--sale);color:#fff}.b.low{background:var(--good);color:#fff}.b.out{background:var(--line);color:var(--mute)}
dialog{border:none;border-radius:14px;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink);padding:18px}
dialog::backdrop{background:#0008}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
.row a{color:var(--brand)}
button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
#more{display:block;margin:16px auto}
.empty{padding:40px;text-align:center;color:var(--mute)}
svg text{fill:var(--mute);font-size:10px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Sale Radar <small>All Pakistani store prices and sales in one place</small></h1>
  <input id="q" type="search" placeholder="Search e.g. tracksuit, kurta, earbuds…" autocomplete="off">
  <div class="filters">
    <select id="store"><option value="">All stores</option></select>
    <select id="sort">
      <option value="rel">Best match</option>
      <option value="low">Price: low → high</option>
      <option value="high">Price: high → low</option>
      <option value="disc">Biggest discount</option>
    </select>
    <label class="chk"><input type="checkbox" id="saleOnly"> On sale only</label>
    <label class="chk"><input type="checkbox" id="stockOnly" checked> In stock</label>
    <label class="chk"><input type="checkbox" id="watchOnly"> ★ Watchlist</label>
  </div>
</div></header>
<main class="wrap">
  <div id="meta">Loading…</div>
  <div id="grid" class="grid"></div>
  <button id="more" hidden>Show more</button>
</main>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
