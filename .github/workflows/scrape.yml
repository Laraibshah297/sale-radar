name: Scrape and deploy
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scraper/scrape.py
      - name: Commit data (keeps price history)
        run: |
          git config user.name "sale-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/data
          git commit -m "Update prices" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - uses: actions/deploy-pages@v4
