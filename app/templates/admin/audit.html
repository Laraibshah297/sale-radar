{% extends "admin/_layout.html" %}{% block admin %}
<h1>Audit log</h1><div class="tablewrap"><table><tr><th>When</th><th>User</th><th>Action</th><th>Entity</th><th>Detail</th></tr>
{% for l in logs %}<tr><td class="small">{{ l.created_at.strftime('%Y-%m-%d %H:%M') }}</td><td class="small">{{ l.user.email if l.user else '—' }}</td><td>{{ l.action }}</td><td class="small">{{ l.entity or '' }} {{ l.entity_id or '' }}</td><td class="small">{{ l.detail }}</td></tr>{% endfor %}</table></div>
{% endblock %}
