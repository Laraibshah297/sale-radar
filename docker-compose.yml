# Production stack for your own Linux server:
#   web     - the website, admin panel and merchant portal
#   worker  - scheduled feed imports (every 6 h) and price alerts (hourly)
#   db      - PostgreSQL 16 (with pg_trgm search)
#   caddy   - HTTPS reverse proxy with automatic free Let's Encrypt certificates
#   backup  - nightly database dump in ./backups (see deploy/backup.sh)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saleradar
      POSTGRES_USER: saleradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleradar"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: {db: {condition: service_healthy}}

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.cli", "scheduler"]
    depends_on: {db: {condition: service_healthy}}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {PGPASSWORD: "${POSTGRES_PASSWORD}", KEEP_DAYS: "14"}
    volumes: ["./backups:/backups", "./deploy/backup.sh:/backup.sh:ro"]
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on: {db: {condition: service_healthy}}

volumes:
  pgdata:
  caddy_data:
